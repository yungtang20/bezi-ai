services:
  - type: web
    name: bezi-ai-api
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: AGNES_API_KEY
        sync: false
      - key: AGNES_BASE_URL
        value: https://apihub.agnes-ai.com/v1
      - key: AGNES_MODEL
        value: agnes-3.0-flash
      - key: BEZI_AUTH_CLIENT_SECRET
        sync: false
      - key: ENABLE_ANONYMOUS_CHAT
        value: 'true'
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://yungtang20.github.io,https://bezi-ai-api.onrender.com
