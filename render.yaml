services:
  - type: web
    name: bezi-ai-api-yungtang20
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: AGNES_API_KEY
        sync: false
      - key: AGNES_BASE_URL
        value: https://apihub.agnes-ai.com/v1
      - key: AGNES_MODEL
        value: agnes-3.0-flash
      - key: BEZI_AUTH_CLIENT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://yungtang20.github.io
      - key: TRUST_PROXY_HOPS
        value: "1"
