name: Bug report
description: Report a reproducible problem without including secrets or personal birth data.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Bezi. Remove API keys, private birth data,
        and other personal information before submitting.
  - type: textarea
    id: symptom
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest reliable sequence of steps.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      description: Commit SHA, branch, or deployment version where this occurred.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node version, and deployment mode.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, credentials, and personal birth data.
          required: true
