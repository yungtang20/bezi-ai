# Temporary one-shot workflow: remove after the lockfile has been regenerated and reviewed.
name: One-time audited lockfile refresh
on:
  push:
    branches:
      - fix/hsu-half-combination-position-trace-20261112
    paths:
      - .github/workflows/security-lockfix.yml
permissions:
  contents: write
jobs:
  lockfile:
    if: github.repository == 'yungtang20/bezi-ai'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Refresh patched transitive dependencies without install scripts
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Validate production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Commit only updated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(security): refresh audited npm lockfile'
            git push origin HEAD:refs/heads/fix/hsu-half-combination-position-trace-20261112
          fi
