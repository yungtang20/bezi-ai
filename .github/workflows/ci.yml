name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Core Package Type Check
      run: npx tsc -p packages/core/tsconfig.json --noEmit

    - name: Run Type & Lint Check
      run: npm run lint

    # 講義知識雙源漂移偵測：差異已知（兩處語意差），未定權威來源前不擋 merge，
    # 但讓差異在 CI log 可見，避免靜默再漂移。
    - name: Check Lecture Data Drift
      run: npm run check:drift
      continue-on-error: true

    - name: Run Unit Tests
      run: npm test
    - name: Run API Integration Tests
      run: npm run test:api

    - name: Build Production Bundle
      run: npm run build
      env:
        NODE_ENV: production

    # [AI MOD] Production bundle 煙霧測試（防火牆）
    # dev 模式不會重現正式版的分包/循環依賴問題，必須實際跑一次 dist 產物。
    - name: Install Playwright Browser
      run: npx playwright install --with-deps chromium

    - name: Production Bundle Smoke Test
      run: npx playwright test tests/e2e/specs/prod-smoke.spec.ts
