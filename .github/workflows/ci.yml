name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Audit Dependencies
      run: npm audit --audit-level=high

    - name: Run Type & Lint Check
      run: npm run lint

    - name: Run Unit Tests
      run: npm test

    - name: Run API Validation Tests
      run: npm run test:api

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Run Browser End-to-End Tests
      run: npm run test:e2e

    - name: Build Production Bundle
      run: npm run build
      env:
        NODE_ENV: production

    - name: Build Production Container
      run: docker build --tag bezi-ai:ci .

    - name: Smoke-test Production Container
      run: |
        docker run --detach --name bezi-ai-ci --publish 3300:3000 bezi-ai:ci
        trap 'docker logs bezi-ai-ci; docker rm --force bezi-ai-ci' EXIT
        curl --fail --silent --show-error \
          --retry 15 --retry-delay 1 --retry-all-errors \
          http://127.0.0.1:3300/health/ready
